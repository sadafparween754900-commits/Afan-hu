
name: 3D Cartoon YouTube Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install gTTS

      - name: Generate 3D Cartoon
        run: python main.py

      - name: Upload 3D Cartoon Video
        uses: actions/upload-artifact@v4
        with:
          name: 3D-cartoon-video
          path: output/
          if-no-files-found: error
          retention-days: 7
