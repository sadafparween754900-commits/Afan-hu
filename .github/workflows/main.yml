
name: Free 2D YouTube Cartoon

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install numpy Pillow imageio imageio-ffmpeg gTTS

      - name: Run cartoon script
        run: python main.py

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-video
          path: output/
          if-no-files-found: error
          retention-days: 7
