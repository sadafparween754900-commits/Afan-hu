
name: Run Script

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth-oauthlib

      - name: Run script
        run: python main.py
        env:
          CREDENTIALS: ${{ secrets.CREDENTIALS }}
